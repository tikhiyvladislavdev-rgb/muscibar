<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Экран зала · Бар Мята</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #050505; --accent: #e8ff47; --text: #fff; --muted: #888; --card: #141414; --border: #2a2a2a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      min-height: 100dvh; display: flex; flex-direction: column;
      overflow: hidden;
    }
    .top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 32px; border-bottom: 1px solid var(--border);
    }
    .brand { font-weight: 800; font-size: 22px; color: var(--accent); letter-spacing: 1px; }
    .clock { font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .grid {
      flex: 1; display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 24px; padding: 28px 32px; min-height: 0;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 24px; padding: 28px; display: flex; flex-direction: column; min-height: 0;
    }
    .label {
      font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--muted); font-weight: 600; margin-bottom: 16px;
    }
    .now {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    }
    .now img {
      width: min(280px, 40vw); height: min(280px, 40vw);
      border-radius: 20px; object-fit: cover;
      box-shadow: 0 20px 60px rgba(232,255,71,.15);
      margin-bottom: 24px; background: #222;
    }
    .now .title { font-size: clamp(22px, 3vw, 36px); font-weight: 800; margin-bottom: 8px; }
    .now .artist { font-size: clamp(16px, 2vw, 22px); color: var(--muted); }
    .now .empty { color: var(--muted); font-size: 20px; }
    .pulse {
      width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
      display: inline-block; margin-right: 8px;
      animation: pulse 1.2s ease infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .4; transform: scale(1.3); }
    }
    .q-list { flex: 1; overflow-y: auto; }
    .q-row {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 0; border-bottom: 1px solid var(--border);
    }
    .q-row:last-child { border-bottom: none; }
    .pos {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(232,255,71,.12); color: var(--accent);
      display: grid; place-items: center; font-weight: 800; font-size: 14px;
    }
    .pos.top { background: var(--accent); color: #000; }
    .q-row img { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: #222; }
    .q-info { flex: 1; min-width: 0; }
    .q-info .t { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .q-info .a { color: var(--muted); font-size: 13px; }
    .bid { font-weight: 800; color: var(--accent); font-size: 18px; white-space: nowrap; }
    .foot {
      padding: 14px 32px; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; color: var(--muted); font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="brand" id="brand">БАР МЯТА</div>
    <div class="clock" id="clock"></div>
  </div>
  <div class="grid">
    <div class="panel">
      <div class="label"><span class="pulse"></span>Сейчас играет</div>
      <div class="now" id="now"></div>
    </div>
    <div class="panel">
      <div class="label">Очередь · топ ставок</div>
      <div class="q-list" id="queue"></div>
    </div>
  </div>
  <div class="foot">
    <span>Заказ музыки на телефоне</span>
    <span id="statsLine"></span>
  </div>
  <script src="shared.js"></script>
  <script>
    function tick() {
      const d = new Date();
      document.getElementById('clock').textContent = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    function render() {
      try {
        const s = getSettings();
        document.getElementById('brand').textContent = s.venueName;
        document.documentElement.style.setProperty('--accent', s.accent);
        const np = getNowPlaying();
        const now = document.getElementById('now');
        if (np) {
          now.innerHTML = `
            <img src="${np.cover || ''}" alt="" onerror="this.style.background='#222'" />
            <div class="title">${np.title}</div>
            <div class="artist">${np.artist}</div>`;
        } else {
          now.innerHTML = '<div class="empty">Ожидание трека…</div>';
        }
        const q = getQueue();
        const ql = document.getElementById('queue');
        if (!q.length) ql.innerHTML = '<div class="empty" style="padding:40px;text-align:center;color:#666">Очередь пуста</div>';
        else {
          ql.innerHTML = q.slice(0, 12).map((o, i) => `
            <div class="q-row">
              <div class="pos ${i===0?'top':''}">${i+1}</div>
              <img src="${o.cover||''}" alt="" />
              <div class="q-info"><div class="t">${o.title}</div><div class="a">${o.artist}</div></div>
              <div class="bid">${Number(o.bid).toLocaleString('ru')} ₽</div>
            </div>`).join('');
        }
        const st = getStats();
        document.getElementById('statsLine').textContent =
          `Сегодня: ${st.todayOrders} заказов · ${Number(st.todayRevenue).toLocaleString('ru')} ₽`;
      } catch (e) { console.warn(e); }
    }
    tick(); render();
    setInterval(tick, 1000);
    setInterval(render, 2000);
    if (typeof onSync === 'function') onSync(render);
  </script>
</body>
</html>
