<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUSCIBAR Player</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#fff;background:#101010}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#292929,#0c0c0c 55%);display:flex;justify-content:center}.app{width:min(1100px,100%);padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-weight:900;letter-spacing:.08em}.pill{padding:8px 12px;border-radius:999px;background:#242424;color:#aaa;font-size:12px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.card{background:#171717;border:1px solid #292929;border-radius:24px;padding:22px;box-shadow:0 18px 60px #0008}.cover{width:100%;aspect-ratio:1;border-radius:18px;background:#242424;display:grid;place-items:center;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.cover span{font-size:80px}.eyebrow{color:#777;font-size:12px;text-transform:uppercase;letter-spacing:.14em;margin-top:20px}.title{font-size:32px;font-weight:900;margin-top:6px}.artist{font-size:17px;color:#aaa;margin-top:4px}.bar{height:7px;background:#303030;border-radius:8px;margin:24px 0 8px;overflow:hidden}.fill{height:100%;width:0;background:#fff}.time{display:flex;justify-content:space-between;color:#777;font-size:12px}.controls{display:flex;justify-content:center;gap:12px;margin-top:18px}.btn{border:0;background:#282828;color:#fff;border-radius:15px;padding:13px 18px;font-size:16px;cursor:pointer}.play{background:#fff;color:#111;font-size:22px;width:64px}.modes{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.mode.active{outline:2px solid #fff}.queue{display:flex;flex-direction:column;gap:8px;margin-top:14px;max-height:520px;overflow:auto}.q{padding:13px 14px;border-radius:15px;background:#222;display:flex;gap:12px;align-items:center}.qnum{color:#777;width:24px}.qmain{flex:1}.qt{font-weight:700}.qa{font-size:12px;color:#888;margin-top:3px}.small{font-size:11px;color:#666}.empty{padding:30px;text-align:center;color:#666}.search{display:flex;gap:8px;margin-top:18px}.search input{flex:1;background:#222;border:1px solid #333;border-radius:12px;padding:12px;color:#fff}.result{padding:10px;border-bottom:1px solid #2b2b2b;cursor:pointer}.result:hover{background:#222}.status{color:#aaa;font-size:12px;margin-top:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.cover{max-height:420px}}
</style></head><body><main class="app"><div class="top"><div class="brand">MUSCIBAR / PLAYER</div><div class="pill" id="modeLabel">QUEUE</div></div><div class="grid"><section class="card"><div class="cover" id="cover"><span>♪</span></div><div class="eyebrow">Сейчас играет</div><div class="title" id="title">Нет трека</div><div class="artist" id="artist">Очередь пуста</div><div class="bar"><div class="fill" id="fill"></div></div><div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div><div class="controls"><button class="btn" id="prev">⏮</button><button class="btn play" id="play">▶</button><button class="btn" id="next">⏭</button></div><div class="modes"><button class="btn mode active" data-mode="queue">Очередь</button><button class="btn mode" data-mode="wave">🌊 Волна</button><button class="btn mode" data-mode="party">🔥 Party</button><button class="btn mode" data-mode="chill">🍸 Chill</button></div><div class="status" id="status">Готово</div><audio id="audio" preload="auto"></audio></section><section class="card"><h2 style="margin-top:0">Следующие</h2><div class="queue" id="queue"><div class="empty">Очередь пуста</div></div><div class="search"><input id="q" placeholder="Найти трек…"><button class="btn" id="searchBtn">Поиск</button></div><div id="results"></div></section></div></main><script>
const audio=document.querySelector('#audio'), $=s=>document.querySelector(s); let state=null, current=null, lastPosition=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});return r.json()}
async function refresh(){state=await api('/api/player');render()}
function render(){const t=state.nowPlaying; current=t; $('#modeLabel').textContent=(state.mode||'queue').toUpperCase(); document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===(state.mode||'queue'))); if(t){$('#title').textContent=t.title||'Без названия';$('#artist').textContent=t.artist||'';$('#cover').innerHTML=t.cover?`<img src="${esc(t.cover)}">`:'<span>♪</span>'}else{$('#title').textContent='Нет трека';$('#artist').textContent='Очередь пуста';$('#cover').innerHTML='<span>♪</span>'} $('#queue').innerHTML=(state.queue||[]).length?(state.queue||[]).map((x,i)=>`<div class="q"><div class="qnum">${i+1}</div><div class="qmain"><div class="qt">${esc(x.title)}</div><div class="qa">${esc(x.artist)} · ${esc(x.source||'queue')}</div></div><button class="btn" onclick="removeTrack('${esc(x.id)}')">×</button></div>`).join(''):'<div class="empty">Очередь пуста</div>';}
async function next(){await api('/api/player',{method:'POST',body:JSON.stringify({action:'next',pin:promptPin()})});await refresh();playCurrent()}
function promptPin(){let p=localStorage.bm_admin_pin||''; if(!p){p=prompt('PIN админа:')||''; if(p)localStorage.bm_admin_pin=p;} return p}
async function post(action,extra={}){return api('/api/player',{method:'POST',headers:{'X-Admin-Pin':promptPin()},body:JSON.stringify({action,...extra})})}
async function playCurrent(){if(!current)return; if(current.file){audio.src=current.file;await audio.play().catch(()=>{$('#status').textContent='Нажми ▶ для запуска аудио';});} else if(current.preview){audio.src=current.preview;await audio.play().catch(()=>{});$('#status').textContent='Доступно только превью источника';}else{$('#status').textContent='У трека нет аудиофайла. Положи файл в /music.'}}
$('#play').onclick=async()=>{if(!current){await next();return}if(audio.paused){await playCurrent();$('#play').textContent='⏸'}else{audio.pause();$('#play').textContent='▶'}};
$('#next').onclick=next;$('#prev').onclick=()=>{audio.currentTime=0;playCurrent()};audio.addEventListener('timeupdate',()=>{$('#cur').textContent=fmt(audio.currentTime);$('#dur').textContent=fmt(audio.duration);$('#fill').style.width=audio.duration?(audio.currentTime/audio.duration*100)+'%':'0%'});audio.addEventListener('ended',next);
async function removeTrack(id){await post('remove',{id});refresh()}
document.querySelectorAll('.mode').forEach(b=>b.onclick=async()=>{await post('mode',{mode:b.dataset.mode});refresh()});
$('#searchBtn').onclick=search;$('#q').onkeydown=e=>{if(e.key==='Enter')search()};async function search(){let q=$('#q').value.trim();if(!q)return;let d=await api('/api/search?q='+encodeURIComponent(q));$('#results').innerHTML=(d.results||[]).slice(0,8).map(t=>`<div class="result" data-id="${esc(t.id)}"><b>${esc(t.title)}</b><br><span class="small">${esc(t.artist)}</span></div>`).join('');document.querySelectorAll('.result').forEach((el,i)=>el.onclick=async()=>{let t=d.results[i];await post('enqueue',{track:t});await refresh()})}
refresh();setInterval(refresh,5000);</script></body></html>
