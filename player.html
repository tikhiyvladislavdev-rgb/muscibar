<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUSCIBAR DJ</title><style>
:root{color-scheme:dark;--bg:#0b0b0c;--card:#151518;--line:#29292e;--muted:#96969f;--accent:#fff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#202024,#0b0b0c 55%);font-family:Inter,system-ui,sans-serif;color:#fff}.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-weight:900;letter-spacing:.12em}.status{color:#9d9da5;font-size:13px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.card{background:rgba(21,21,24,.94);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 20px 70px #0008}.cover{width:100%;aspect-ratio:1;border-radius:18px;object-fit:cover;background:#222}.now{display:grid;grid-template-columns:280px 1fr;gap:22px}.eyebrow{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.15em;margin-top:6px}.title{font-size:34px;font-weight:900;margin:8px 0 3px}.artist{color:#aaaab2;font-size:18px}.bar{height:6px;background:#303036;border-radius:10px;margin:24px 0 8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff}.time{display:flex;justify-content:space-between;color:#8e8e96;font-size:12px}.controls{display:flex;gap:10px;align-items:center;margin-top:18px}.btn{border:1px solid var(--line);background:#202024;color:#fff;border-radius:14px;padding:13px 16px;cursor:pointer}.main{width:58px;height:58px;border-radius:50%;font-size:20px}.mode{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.mode button.active{background:#fff;color:#000}.queue h2{font-size:16px;margin:0 0 12px}.item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #25252a}.thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#222}.num{color:#777;font-size:12px;width:18px}.meta{min-width:0}.meta b,.meta span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta span{color:#999;font-size:13px;margin-top:3px}.search{display:flex;gap:8px;margin-bottom:14px}.search input{flex:1;background:#101014;border:1px solid var(--line);border-radius:13px;padding:13px;color:#fff}.results{max-height:430px;overflow:auto}.res{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #242429}.res .add{margin-left:auto}.small{color:#8d8d95;font-size:12px}.wave{display:flex;gap:8px;margin:12px 0}.wave input{flex:1;background:#101014;border:1px solid var(--line);border-radius:12px;color:#fff;padding:11px}@media(max-width:800px){.grid,.now{grid-template-columns:1fr}.now{gap:15px}.cover{max-height:330px}.title{font-size:28px}}
</style></head><body><div class="wrap"><div class="top"><div class="brand">MUSCIBAR / DJ</div><div class="status" id="status">проверка Яндекс…</div></div><div class="grid"><section class="card"><div class="now"><img id="cover" class="cover" alt=""><div><div class="eyebrow">Сейчас играет</div><div class="title" id="title">Очередь пуста</div><div class="artist" id="artist">Запусти поиск или волну</div><div class="bar"><i id="progress"></i></div><div class="time"><span id="elapsed">0:00</span><span id="duration">0:00</span></div><div class="controls"><button class="btn" id="prev">⏮</button><button class="btn main" id="play">▶</button><button class="btn" id="next">⏭</button></div></div></div><div class="mode"><button class="btn active" data-mode="queue">Очередь</button><button class="btn" data-mode="wave">🌊 Моя волна</button><button class="btn" data-mode="party">🔥 Party</button></div></section><section class="card queue"><h2>Очередь</h2><div id="queue"></div></section></div><section class="card" style="margin-top:18px"><div class="search"><input id="q" placeholder="Песня или исполнитель…"><button class="btn" id="go">Найти</button></div><div class="wave"><input id="seed" placeholder="Волна: track:ID / artist:ID / user:onyourwave" value="user:onyourwave"><button class="btn" id="startWave">Запустить волну</button></div><div class="results" id="results"></div><div class="small">Яндекс используется как каталог и источник рекомендаций. Для полноценного коммерческого воспроизведения проверьте права на музыкальный контент.</div></section></div><audio id="audio" preload="metadata"></audio><script>
const $=s=>document.querySelector(s);let queue=[],index=-1,mode='queue';const audio=$('#audio');
function fmt(n){n=Math.max(0,Math.floor(n||0));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function render(){ $('#queue').innerHTML=queue.length?queue.map((t,i)=>`<div class="item"><div class="num">${i+1}</div><img class="thumb" src="${t.cover||''}"><div class="meta"><b>${esc(t.title)}</b><span>${esc(t.artist)}</span></div></div>`).join(''):'<div class="small">Очередь пуста</div>'; if(queue[index]){let t=queue[index];$('#cover').src=t.cover||'';$('#title').textContent=t.title;$('#artist').textContent=t.artist;$('#duration').textContent=fmt(t.duration)}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(url,opt){let r=await fetch(url,opt);let d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка');return d}
function add(t,autoplay=false){queue.push(t);if(index<0)index=0;render();if(autoplay)playIndex(queue.length-1)}
async function playIndex(i){if(!queue[i])return;index=i;render();if(queue[index].preview){audio.src=queue[index].preview;try{await audio.play()}catch(e){$('#status').textContent='Нажмите ▶ для запуска';}}else{$('#status').textContent='У трека нет доступного preview; добавлен в очередь';}}
$('#play').onclick=()=>{if(audio.src){audio.paused?audio.play():audio.pause()}else if(queue[index])playIndex(index)};$('#next').onclick=()=>{if(index+1<queue.length)playIndex(index+1)};$('#prev').onclick=()=>{if(index>0)playIndex(index-1)};audio.onplay=()=>$('#play').textContent='⏸';audio.onpause=()=>$('#play').textContent='▶';audio.ontimeupdate=()=>{$('#progress').style.width=(audio.duration?audio.currentTime/audio.duration*100:0)+'%';$('#elapsed').textContent=fmt(audio.currentTime)};audio.onended=()=>$('#next').click();
async function search(){let q=$('#q').value.trim();if(!q)return;$('#results').innerHTML='<div class="small">Ищем…</div>';try{let d=await api('/api/yandex/search?q='+encodeURIComponent(q));$('#results').innerHTML=(d.results||[]).map(t=>`<div class="res"><img class="thumb" src="${t.cover||''}"><div class="meta"><b>${esc(t.title)}</b><span>${esc(t.artist)}</span></div><button class="btn add" data-id="${t.yandexId}" data-title="${esc(t.title)}">＋</button></div>`).join('')||'<div class="small">Ничего не найдено</div>';let map=d.results||[];document.querySelectorAll('.res .add').forEach((b,i)=>b.onclick=()=>add(map[i],queue.length===0));}catch(e){$('#results').innerHTML='<div class="small">'+esc(e.message)+'</div>'}}
async function wave(){let seed=$('#seed').value.trim()||'user:onyourwave';try{let d=await api('/api/yandex/wave?seed='+encodeURIComponent(seed));queue=(d.results||[]);index=queue.length?0:-1;render();if(index>=0)playIndex(index);$('#status').textContent='🌊 Волна запущена';}catch(e){$('#status').textContent=e.message}}
$('#go').onclick=search;$('#q').onkeydown=e=>{if(e.key==='Enter')search()};$('#startWave').onclick=wave;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;if(mode==='wave')wave();if(mode==='party'){$('#seed').value='mood:party';wave()}});
(async()=>{try{let s=await api('/api/yandex/status');$('#status').textContent=s.ok?'Яндекс подключён: '+(s.login||'OK'):'Яндекс не настроен'}catch(e){$('#status').textContent='Яндекс недоступен'}})();render(); if(new URLSearchParams(location.search).get('mode')==='wave'){setTimeout(()=>wave(),300);}
</script></body></html>
